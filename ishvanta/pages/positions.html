<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Open Tech Jobs in Hyderabad | Ishvanta Solutions Hiring Partners</title>
  <meta name="description" content="Browse open tech positions sourced by Ishvanta Solutions from hiring partners. Real jobs for Data Engineers, DevOps Engineers, React Developers, QA Engineers and more in Hyderabad." />
  <meta name="keywords" content="tech jobs Hyderabad, data engineer jobs, DevOps jobs Hyderabad, React developer jobs, QA engineer jobs, IT jobs Madhapur, Ishvanta Solutions hiring" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.ishvantasolutions.com/pages/positions.html" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.ishvantasolutions.com/pages/positions.html" />
  <meta property="og:title" content="Open Tech Jobs in Hyderabad | Ishvanta Solutions" />
  <meta property="og:description" content="Real tech jobs from Ishvanta Solutions hiring partners. Data, DevOps, Web, Mobile, QA roles in Hyderabad." />
  <meta property="og:image" content="https://www.ishvantasolutions.com/images/Logo.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@ishvantaacademy" />
  <meta name="twitter:title" content="Open Tech Jobs | Ishvanta Solutions" />
  <meta name="twitter:description" content="Browse live tech job openings sourced by Ishvanta Solutions from top hiring partners." />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Open Positions — Ishvanta Solutions",
    "url": "https://www.ishvantasolutions.com/pages/positions.html",
    "description": "Tech job openings curated by Ishvanta Solutions from hiring partners across India.",
    "publisher": {
      "@type": "Organization",
      "name": "Ishvanta Solutions",
      "url": "https://www.ishvantasolutions.com"
    }
  }
  </script>

  <link rel="icon" type="image/png" href="../images/Logo.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/inner.css" />
  <link rel="stylesheet" href="../css/positions.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <section class="page-hero">
    <div class="section-tag">Hiring</div>
    <h1 class="section-title">Open <span class="highlight">Positions.</span></h1>
    <p class="section-subtitle">Roles sourced from our hiring partners. Real jobs, real companies, real opportunities for upskilled professionals.</p>
  </section>

  <section class="section">
    <div id="positions-loading" class="positions-loading">
      <div class="loading-spinner"></div>
      <p>Fetching live positions…</p>
    </div>
    <div id="positions-error" class="positions-error" style="display:none">
      <p>Could not load positions right now. Please try again or contact us directly.</p>
    </div>
    <div id="positions-container" style="display:none"></div>
  </section>

  <!-- Job Detail Drawer -->
  <div id="job-drawer-overlay" class="drawer-overlay"></div>
  <aside id="job-drawer" class="job-drawer">
    <button id="drawer-close" class="drawer-close" aria-label="Close">✕</button>
    <div id="drawer-content" class="drawer-content"></div>
  </aside>

  <div id="footer-placeholder"></div>
  <script src="../js/main.js"></script>
  <script src="../js/positions.js"></script>
</body>
</html>
